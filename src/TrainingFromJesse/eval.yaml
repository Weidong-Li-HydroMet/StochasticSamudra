# Source: Samudra 6b88f2c0204828ef77d41b3ab2733679615f53e8
# Replace /path/to locations before use.
# Same evaluation settings as successful W&B run 09lp9g3k.
debug: false
save_zarr: true
disk_mode: true
num_model_steps_forward: 25
backend: cuda
experiment:
  name: quarter-averaged-v2-i2-o1-ar8-main-6b88f2c0-eval-best-wandb-retry
  rand_seed: 15
  base_output_dir: /path/to/evaluation-output
  wandb:
    mode: online
    project: default
  data_root: /path/to/averaged-quarterdeg
data:
  sources:
  - type: om4
    prognostic_vars_key: thermo_dynamic_all
    boundary_vars_key: tau_hfds
    train_time:
      start: '1975-01-03'
      end: '2013-10-05'
    val_time:
      start: '2013-10-05'
      end: '2014-10-05'
    inference_time:
      start: '2014-10-10'
      end: '2022-12-24'
    data_location: OM4.zarr
    data_means_location: OM4_means.zarr
    data_stds_location: OM4_stds.zarr
  loading:
    type: rust
  input_steps: 2
  output_steps: 1
model:
  checkpointing: simple
  pred_residuals: false
  last_kernel_size: 3
  pad: circular
  use_bfloat16: true
  unet:
    ch_width:
    - 280
    - 380
    - 480
    - 520
    dilation:
    - 1
    - 2
    - 4
    - 8
    n_layers:
    - 1
    - 1
    - 1
    - 1
    core_block:
      block_type: conv_next_block
      kernel_size: 3
      activation: capped_gelu
      upscale_factor: 2
      norm: instance
    down_sampling_block: avg_pool
    up_sampling_block: zonally_periodic_upsample
ckpt_path: /path/to/best_validation_ckpt.pt
